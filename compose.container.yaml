services:
  # Redis for Gateway Service
  redis-gateway:
    extends:
      file: compose.base.yaml
      service: redis-gateway

  # Mock User Service for Gateway testing
  mock-user-service:
    extends:
      file: compose.base.yaml
      service: mock-user-service

  # Mock Lead Service for Gateway testing
  mock-lead-service:
    extends:
      file: compose.base.yaml
      service: mock-lead-service

  # Mock Pipeline Service for Gateway testing
  mock-pipeline-service:
    extends:
      file: compose.base.yaml
      service: mock-pipeline-service

  # Mock Contact Service for Gateway testing
  mock-contact-service:
    extends:
      file: compose.base.yaml
      service: mock-contact-service

  # Gateway Service - Full platform run including build phase
  gateway-service:
    extends:
      file: compose.base.yaml
      service: gateway-service

networks:
  gateway-network:
    name: iqscaffold-gateway-network-dev
    external: false

volumes:
  redis_gateway_data:
    name: iqscaffold_gateway_redis_data_dev
  gateway_logs:
    name: iqscaffold_gateway_logs_dev
  gateway_tmp:
    name: iqscaffold_gateway_tmp_dev
