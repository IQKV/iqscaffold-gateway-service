# Billing Service Module Configuration
# 
# This profile configures the billing service integration.
# Routing and rate-limiting are configured programmatically in:
# - BillingRouteConfig.java (routes)
# - BillingRateLimitConfig.java (rate limits)
# - BillingOpenApiConfig.java (OpenAPI docs)
#
# To enable: spring.profiles.active=billing

iqscaffold:
  gateway:
    routing:
      services:
        billing-service:
          uri: ${IQSCAFFOLD_GATEWAY_ROUTING_BILLING_SERVICE_URI:http://iqscaffold-billing-service:8080}
          path: /v1/**
          enabled: true
          connect-timeout: 5000
          response-timeout: 30000
          openapi:
            enabled: true
            display-name: "Billing Service APIs"
            description: "Payments, subscriptions and invoicing"
            context-path: "billing-service"
