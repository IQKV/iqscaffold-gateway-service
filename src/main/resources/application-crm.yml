# CRM Services Module Configuration
#
# This profile configures CRM services integration (Lead, Pipeline, Contact).
# Routing and rate-limiting are configured programmatically in:
# - CrmRouteConfig.java (routes and rate limits)
#
# To enable: spring.profiles.active=crm

iqscaffold:
  gateway:
    routing:
      services:
        lead-service:
          uri: ${IQSCAFFOLD_GATEWAY_ROUTING_LEAD_SERVICE_URI:http://lead-service}
          path: /v1/**
          enabled: true
          connect-timeout: 5000
          response-timeout: 30000
          openapi:
            enabled: true
            display-name: "Lead Service APIs"
            description: "Lead management and tracking"
            context-path: "lead-service"
        pipeline-service:
          uri: ${IQSCAFFOLD_GATEWAY_ROUTING_PIPELINE_SERVICE_URI:http://pipeline-service}
          path: /v1/**
          enabled: true
          connect-timeout: 5000
          response-timeout: 30000
          openapi:
            enabled: true
            display-name: "Pipeline Service APIs"
            description: "Sales pipeline and follow-up management"
            context-path: "pipeline-service"
        contact-service:
          uri: ${IQSCAFFOLD_GATEWAY_ROUTING_CONTACT_SERVICE_URI:http://iqscaffold-contact-service}
          path: /v1/**
          enabled: true
          connect-timeout: 5000
          response-timeout: 30000
          openapi:
            enabled: true
            display-name: "Contact Service APIs"
            description: "Contact and company management"
            context-path: "contact-service"
