# Local Development Environment Configuration
# This configuration is optimized for development with debug logging and relaxed security

iqscaffold:
  cache:
    redis:
      key-prefix: "iqscaffold:gateway:local"
      enable-statistics: true

  gateway:
    routing:
      api-prefix:
        strip-count: ${API_STRIP_COUNT:0}
      services:
        user-service:
          connect-timeout: 10000
          response-timeout: 60000
    
    security:
      jwt:
        access-token-expiry: PT30M
        refresh-token-expiry: P30D
      authentication:
        token-validation-timeout: PT10S
    
    rate-limiting:
      redis:
        key-prefix: "iqscaffold:gateway:rate-limit:local"
      policies:
        default-requests-per-minute: 120
        default-burst-capacity: 200
        endpoints:
          "/api/v1/auth/login":
            requests-per-minute: 20
            burst-capacity: 40
            enable-tenant-quotas: false
      tenant-quotas:
        enabled: false
    
    circuit-breaker:
      failure-rate-threshold: 70
      slow-call-rate-threshold: 70
      slow-call-duration-threshold: PT5S
      minimum-number-of-calls: 5
      wait-duration-in-open-state: PT10S
      sliding-window-size: 50
    
    transformation:
      request:
        additional-headers:
          X-Gateway-Version: "1.0.0-local"
          X-Environment: "local"
      response:
        enable-security-headers: false

  observability:
    metrics:
      prefix: iqscaffold_gateway_local
      custom-tags:
        environment: local
    logging:
      level: DEBUG
      enable-response-logging: true

logging:
  level:
    com.iqscaffold: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    reactor.netty: DEBUG
    io.lettuce: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    try-it-out-enabled: true
