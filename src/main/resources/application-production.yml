# Production Environment Configuration
# This configuration is optimized for production with minimal logging and maximum security

server:
  forward-headers-strategy: FRAMEWORK  # Trust X-Forwarded-* headers from ingress controller

spring:
  cloud:
    gateway:
      forwarded:
        enabled: true  # Enable X-Forwarded-* header support in Spring Cloud Gateway

iqscaffold:
  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD}
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 4
      key-prefix: "iqscaffold:gateway:production"
      default-ttl: PT15M

  gateway:
    routing:
      api-prefix:
        strip-count: ${API_STRIP_COUNT:0}
      services:
        user-service:
          uri: ${IQSCAFFOLD_GATEWAY_ROUTING_USER_SERVICE_URI}
          openapi:
            enabled: false
    
    security:
      jwt:
        jwk-set-uri: ${USER_SERVICE_JWK_URI}
      authentication:
        user-service-url: ${IQSCAFFOLD_GATEWAY_SECURITY_USER_SERVICE_URL}
    
    rate-limiting:
      redis:
        key-prefix: "iqscaffold:gateway:rate-limit:production"
    
    cors:
      allowed-origins:
        - ${IQSCAFFOLD_GATEWAY_CORS_ALLOWED_ORIGINS}
    
    transformation:
      request:
        additional-headers:
          X-Gateway-Version: "1.0.0"
          X-Environment: "prd"

  observability:
    tracing:
      sampling-rate: 0.01
      endpoint: ${IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT}
      batch-size: 1024
    metrics:
      custom-tags:
        environment: production
    logging:
      level: WARN
      format: json
      enable-request-logging: false
      include-user-id: false

logging:
  level:
    com.iqscaffold: WARN
    org.springframework.cloud.gateway: ERROR
    org.springframework.security: ERROR
    org.springframework.web: ERROR
    reactor.netty: ERROR
    io.lettuce: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 0.01

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
