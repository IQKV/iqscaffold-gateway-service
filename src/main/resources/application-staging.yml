# Staging Environment Configuration
# This configuration is optimized for staging with moderate logging and security

server:
  forward-headers-strategy: FRAMEWORK  # Trust X-Forwarded-* headers from ingress controller

spring:
  cloud:
    gateway:
      forwarded:
        enabled: true  # Enable X-Forwarded-* header support in Spring Cloud Gateway

iqscaffold:
  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST:redis-staging}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD}
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
      key-prefix: "iqscaffold:gateway:staging"
      default-ttl: PT30M

  gateway:
    routing:
      services:
        user-service:
          uri: ${IQSCAFFOLD_GATEWAY_ROUTING_USER_SERVICE_URI:http://iqscaffold-user-service}
    
    security:
      jwt:
        jwk-set-uri: ${USER_SERVICE_JWK_URI:http://iqscaffold-user-service/.well-known/jwks.json}
      authentication:
        user-service-url: ${IQSCAFFOLD_GATEWAY_SECURITY_USER_SERVICE_URL:http://iqscaffold-user-service}
    
    rate-limiting:
      redis:
        key-prefix: "iqscaffold:gateway:rate-limit:staging"
    
    cors:
      allowed-origins:
        - ${IQSCAFFOLD_GATEWAY_CORS_ALLOWED_ORIGINS:https://iqscaffold.website}
    
    transformation:
      request:
        additional-headers:
          X-Gateway-Version: "1.0.0-staging"
          X-Environment: "staging"

  observability:
    tracing:
      sampling-rate: 0.1
      endpoint: ${IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT:http://otel-collector:4317}
    metrics:
      prefix: iqscaffold_gateway_staging
      custom-tags:
        environment: staging
    logging:
      format: json

logging:
  level:
    com.iqscaffold: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    reactor.netty: WARN
    io.lettuce: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"

management:
  tracing:
    sampling:
      probability: 0.1

springdoc:
  swagger-ui:
    try-it-out-enabled: false
