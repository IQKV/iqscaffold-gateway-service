server:
  port: 8080

spring:
  application:
    name: iqscaffold-gateway-service
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: local,crm,billing
  output:
    ansi:
      enabled: always
  data:
    redis:
      host: ${iqscaffold.cache.redis.host}
      port: ${iqscaffold.cache.redis.port}
      password: ${iqscaffold.cache.redis.password}
      database: ${iqscaffold.cache.redis.database}
      timeout: ${iqscaffold.cache.redis.timeout}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service-public-signup
              uri: ${iqscaffold.gateway.routing.services.user-service.uri}
              predicates:
                - Path=/api/v1/public/signup
              filters:
                - StripPrefix=${iqscaffold.gateway.routing.api-prefix.strip-count:0}
            - id: user-service-public-tenants
              uri: ${iqscaffold.gateway.routing.services.user-service.uri}
              predicates:
                - Path=/api/v1/public/tenants
              filters:
                - StripPrefix=${iqscaffold.gateway.routing.api-prefix.strip-count:0}
            - id: user-service-auth
              uri: ${iqscaffold.gateway.routing.services.user-service.uri}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=${iqscaffold.gateway.routing.api-prefix.strip-count:0}
            - id: user-service-profile
              uri: ${iqscaffold.gateway.routing.services.user-service.uri}
              predicates:
                - Path=/api/v1/users/me,/api/v1/users/me/**
              filters:
                - StripPrefix=${iqscaffold.gateway.routing.api-prefix.strip-count:0}
            - id: user-service-admin
              uri: ${iqscaffold.gateway.routing.services.user-service.uri}
              predicates:
                - Path=/api/v1/admin/**
              filters:
                - StripPrefix=${iqscaffold.gateway.routing.api-prefix.strip-count:0}
            - id: user-service-jwks
              uri: ${iqscaffold.gateway.routing.services.user-service.uri}
              predicates:
                - Path=/.well-known/jwks.json
              filters:
                - StripPrefix=0
            - id: health-check
              uri: ${iqscaffold.gateway.routing.services.user-service.uri}
              predicates:
                - Path=/actuator/health
              filters:
                - StripPrefix=0
            # Invitation Management - Authenticated endpoints
            - id: user-service-invitations
              uri: ${iqscaffold.gateway.routing.services.user-service.uri}
              predicates:
                - Path=/api/v1/invitations,/api/v1/invitations/**
              filters:
                - StripPrefix=${iqscaffold.gateway.routing.api-prefix.strip-count:0}
            # Invitation Management - Public endpoints
            - id: user-service-public-invitations
              uri: ${iqscaffold.gateway.routing.services.user-service.uri}
              predicates:
                - Path=/api/v1/public/invitations/**
              filters:
                - StripPrefix=${iqscaffold.gateway.routing.api-prefix.strip-count:0}

# IQ Key Value Gateway Configuration
iqscaffold:
  # Internationalization configuration
  i18n:
    supported-locales:
      - en
      - es
      - fr
    default-locale: en
  
  # Platform Configuration - Extensible Feature and Authority Management
  platform:
    security:
      routeProtection:
        protectedRoutes:
          # CRM Routes
          "/api/*/crm/**": [ "CRM_ACCESS", "ADMIN", "SUPER_ADMIN" ]
          "/api/*/leads/**": [ "CRM_ACCESS", "ADMIN", "SUPER_ADMIN" ]
          "/api/*/contacts/**": [ "CRM_ACCESS", "ADMIN", "SUPER_ADMIN" ]
          "/api/*/pipeline/**": [ "CRM_ACCESS", "ADMIN", "SUPER_ADMIN" ]
          
          # Billing Routes
          "/api/*/billing/**": [ "BILLING_ACCESS", "ADMIN", "SUPER_ADMIN" ]
          "/api/*/payments/**": [ "BILLING_ACCESS", "ADMIN", "SUPER_ADMIN" ]
          "/api/*/subscriptions/**": [ "BILLING_ACCESS", "ADMIN", "SUPER_ADMIN" ]
          "/api/*/invoices/**": [ "BILLING_ACCESS", "ADMIN", "SUPER_ADMIN" ]
          
          # Admin Routes
          "/api/*/admin/**": [ "ADMIN", "SUPER_ADMIN" ]
          "/actuator/**": [ "ADMIN", "SUPER_ADMIN" ]
          
          # API Routes (general)
          "/api/**": [ "API_ACCESS", "CRM_ACCESS", "BILLING_ACCESS", "USER", "ADMIN", "SUPER_ADMIN" ]
      
      accessControl:
        enableFeatureValidation: true
        enableMicroserviceValidation: true
        enableRouteValidation: true
        bypassAuthorities: [ "SUPER_ADMIN" ]
  
  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST:localhost}
      port: ${IQSCAFFOLD_CACHE_REDIS_PORT:6379}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD:}
      database: ${IQSCAFFOLD_CACHE_REDIS_DATABASE:0}
      timeout: PT2S
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
      key-prefix: "iqscaffold:gateway"
      default-ttl: PT1H
      enable-statistics: false
  
  gateway:
    routing:
      # API prefix configuration - allows stripping /api prefix when deployed on api.iqscaffold.com
      api-prefix:
        enabled: true
        prefix: /api
        strip-count: ${API_STRIP_COUNT:0}  # Number of path segments to strip (0 = no stripping, 1 = strip first segment)
      services:
        user-service:
          uri: ${IQSCAFFOLD_GATEWAY_ROUTING_USER_SERVICE_URI:http://iqscaffold-user-service}
          path: /v1/**
          enabled: true
          connect-timeout: 10000
          response-timeout: 60000
          openapi:
            enabled: true
            display-name: "User Service APIs"
            description: "Authentication and user management APIs"
            context-path: "user-service"
        billing-service:
          uri: ${IQSCAFFOLD_GATEWAY_ROUTING_BILLING_SERVICE_URI:http://iqscaffold-billing-service}
          path: /v1/**
          enabled: true
          connect-timeout: 5000
          response-timeout: 30000
          openapi:
            enabled: true
            display-name: "Billing Service APIs"
            description: "Payments, subscriptions, invoicing, and feature management APIs"
            context-path: "billing-service"
      enable-service-discovery: false
    
    security:
      jwt:
        access-token-expiry: PT15M
        refresh-token-expiry: P7D
        issuer: iqscaffold-user-service
        audience: iqscaffold-services
        algorithm: HS256
        secret-key: ${JWT_SECRET_KEY:change-me-in-production}
        jwk-set-uri: ${USER_SERVICE_JWK_URI:http://iqscaffold-user-service/.well-known/jwks.json}
      authentication:
        enabled: true
        user-service-url: ${IQSCAFFOLD_GATEWAY_SECURITY_USER_SERVICE_URL:http://iqscaffold-user-service}
        token-validation-timeout: PT5S
        enable-user-context-propagation: true
      public-paths:
        # JWK endpoint for public key distribution
        - /.well-known/jwks.json
        
        # Self-service provisioning endpoints
        - /api/v1/public/**
        
        # Authentication endpoints
        - /api/v1/auth/**
        
        # Actuator endpoints
        - /actuator/health/**
        - /actuator/info
        - /actuator/prometheus
        
        # Billing health check endpoints (public for service monitoring)
        - /api/v1/billing/payments/health
        - /api/v1/billing/subscriptions/health
        - /api/v1/billing/invoices/health
        - /api/v1/billing/gateway/health
        
        # CRM health check endpoints (public for service monitoring)
        - /api/v1/leads/health
        - /api/v1/contacts/health
        - /api/v1/pipeline/health
        
        # API Documentation (root level)
        - /api/v1/docs
        - /swagger-ui/**
        - /api-docs/**
        
        # Service-specific OpenAPI Documentation (consolidated pattern)
        - /*/swagger-ui/**
        - /*/api-docs/**
        - /*/v3/api-docs/**
        - /*/swagger-resources/**
        - /*/swagger-config/**
        - /*/swagger-ui.html
        - /*/webjars/**
        
        # Webhooks (public - no authentication required)
        - /api/v1/billing/webhooks/**
        - /api/v1/crm/webhooks/**
        
        # Public subscription plans (for pricing pages)
        - /api/v1/billing/subscription-plans/**
    
    cors:
      enabled: true
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
        - http://localhost:8080
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
      max-age: 3600
    
    transformation:
      request:
        enabled: true
        enable-header-enrichment: true
        enable-user-context-propagation: true
        enable-tenant-context-propagation: true
        enable-feature-context-propagation: true
        headers-to-remove:
          - Authorization-Internal
          - X-Internal-Token
        additional-headers:
          X-Gateway-Version: "1.0.0"
      response:
        enabled: true
        enable-security-headers: true
        enable-correlation-headers: true
        remove-internal-headers: true
        additional-headers-to-remove:
          - X-Internal-Service
          - X-Database-Query-Time
    
    feature-access:
      enabled: true
      excluded-paths:
        - /.well-known/jwks.json
        - /api/v1/public/**
        - /api/v1/auth/**
        - /actuator/health
        - /actuator/info
        - /swagger-ui/**
        - /api-docs/**
      mappings: [ ]
      cache:
        ttl: PT5M
        max-size: 1000
        enable-statistics: false

  observability:
    tracing:
      enabled: true
      service-name: ${spring.application.name}
      sampling-rate: 1.0
      endpoint: ${IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT:http://localhost:4317}
      timeout: PT10S
      export-timeout: PT30S
      batch-size: 512
    metrics:
      enabled: true
      path: /actuator/prometheus
      prefix: iqscaffold_gateway
      include-host-tag: true
      include-application-tag: true
      include-environment-tag: true
      custom-tags:
        service: gateway-service
      enabled-metrics:
        - gateway.requests
        - gateway.response.time
    logging:
      level: INFO
      format: console
      enable-request-logging: true
      enable-response-logging: false
      enable-correlation-id: true
      include-trace-id: true
      include-span-id: true
      include-user-id: true
      include-tenant-id: true
      correlation-id-header: X-Correlation-ID
      request-id-header: X-Request-ID
      tenant-id-header: X-Tenant-ID

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls-primary-name: Gateway APIs
    try-it-out-enabled: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      access: read_only
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true
